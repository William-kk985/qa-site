[package]
name = "medium-vec"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["cdylib"]
[profile.release]
# 和 rust-fixed/Cargo.toml **逐字相同** —— 体积差只能来自 Vec，
# 不能来自构建参数（这是本基准可信的前提）。
opt-level = "z"   # 要体积不要速度
lto = true        # 跨 crate 内联，把用不到的分支整段删掉
strip = true      # 去掉 name/producers 元数据段
panic = "abort"   # 不要 unwind 表，但 panic 的**格式化**代码照样会被链进来
