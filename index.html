<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>问答站</title>
<meta name="description" content="一个提问 / 回答的社区：发问题、写回答、选最佳答案。">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="#/">
      <span class="brand-mark">问</span>
      <span class="brand-text">问答站</span>
    </a>

    <form class="search" id="search-form" role="search">
      <input id="search-input" type="search" placeholder="搜索问题、标签…" autocomplete="off" aria-label="搜索">
    </form>

    <div class="topbar-actions">
      <button class="btn btn-primary" data-action="ask">提问题</button>
      <button class="btn btn-ghost bell-btn hidden" id="bell-btn" data-action="notices"
              title="通知" aria-label="通知">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor"
             stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
          <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
        </svg>
        <span class="bell-badge hidden" id="bell-badge">0</span>
      </button>
      <div id="user-box" class="user-box"></div>
    </div>
  </div>
</header>

<main id="app" class="app">
  <div class="empty"><div class="big">⏳</div><p>正在加载…</p></div>
</main>

<footer class="foot">
  <span>提问和回答都保存在云端，任何人都能看到 · 用 GitHub 账号一键登录，也可以邮箱注册</span>
</footer>

<!-- 登录 / 注册弹窗 -->
<div class="modal-mask hidden" id="modal-mask">
  <div class="modal mode-login" id="modal">
    <h2 class="modal-title" id="modal-title">登录</h2>
    <p class="modal-sub" id="modal-sub">用一个邮箱注册就行，不需要 GitHub 账号。</p>

    <div class="tabs auth-tabs">
      <button type="button" class="tab is-active" data-action="auth-mode" data-mode="login">登录</button>
      <button type="button" class="tab" data-action="auth-mode" data-mode="signup">注册</button>
    </div>

    <button type="button" class="btn btn-github" data-action="oauth-github">
      <svg viewBox="0 0 16 16" width="17" height="17" aria-hidden="true" fill="currentColor">
        <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27s1.36.09 2 .27c1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/>
      </svg>
      用 GitHub 账号登录 / 注册
    </button>

    <div class="divider"><span>或者用邮箱</span></div>

    <form id="auth-form">
      <label class="field signup-only">
        <span class="field-label">昵称（别人看到的名字）</span>
        <input name="display_name" maxlength="16" placeholder="例如：小明" autocomplete="nickname">
      </label>
      <label class="field">
        <span class="field-label">邮箱</span>
        <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="field">
        <span class="field-label">密码</span>
        <input name="password" type="password" required minlength="6" autocomplete="current-password" placeholder="至少 6 位">
      </label>

      <p class="form-error hidden" id="auth-error"></p>

      <p class="auth-help login-only">
        <button type="button" class="linkbtn" data-action="forgot">忘记密码？</button>
      </p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-action="close-modal">取消</button>
        <button type="submit" class="btn btn-primary" id="auth-submit">登录</button>
      </div>
    </form>
  </div>
</div>

<!-- 我的账号：改昵称 / 退出登录 -->
<div class="modal-mask hidden" id="profile-mask">
  <div class="modal">
    <h2 class="modal-title">我的账号</h2>
    <p class="modal-sub">登录邮箱：<b id="profile-email"></b></p>
    <form id="profile-form">
      <label class="field">
        <span class="field-label">昵称（别人看到的名字）</span>
        <input name="display_name" maxlength="16" required placeholder="例如：小明">
      </label>
      <p class="form-error hidden" id="profile-error"></p>
      <div class="modal-actions modal-actions-split">
        <div>
          <button type="button" class="btn btn-ghost btn-sm" data-action="change-password">修改密码</button>
          <button type="button" class="btn btn-ghost btn-sm" data-action="logout">退出登录</button>
        </div>
        <button type="submit" class="btn btn-primary">保存</button>
      </div>
    </form>

    <div class="id-section">
      <div class="field-label">登录方式</div>
      <div class="id-list" id="identity-list"></div>
      <p class="hint" id="identity-hint">绑到一起之后，这几种方式都能登进同一个账号，看到的内容也是同一份。</p>
    </div>
  </div>
</div>

<!-- 找回密码 / 设置新密码（两种模式共用一个弹窗） -->
<div class="modal-mask hidden" id="reset-mask">
  <div class="modal">
    <h2 class="modal-title" id="reset-title">找回密码</h2>
    <p class="modal-sub" id="reset-sub">填注册时用的邮箱，我们会发一封带重置链接的邮件给你。</p>
    <form id="reset-form">
      <label class="field" id="reset-email-field">
        <span class="field-label">邮箱</span>
        <input name="email" type="email" required autocomplete="email" placeholder="you@example.com">
      </label>
      <label class="field hidden" id="reset-pass-field">
        <span class="field-label">新密码</span>
        <input name="password" type="password" minlength="6" required autocomplete="new-password" placeholder="至少 6 位">
      </label>

      <p class="form-error hidden" id="reset-error"></p>
      <p class="form-ok hidden" id="reset-ok"></p>

      <div class="modal-actions">
        <button type="button" class="btn btn-ghost" data-action="close-modal">关闭</button>
        <button type="submit" class="btn btn-primary" id="reset-submit">发送重置邮件</button>
      </div>
    </form>
  </div>
</div>

<!-- 站内通知 -->
<div class="modal-mask hidden" id="notice-mask">
  <div class="modal modal-wide">
    <div class="modal-head">
      <h2 class="modal-title">通知</h2>
      <button type="button" class="linkbtn" data-action="read-all">全部标为已读</button>
    </div>
    <div class="notice-list" id="notice-list"></div>
    <div class="modal-actions">
      <button type="button" class="btn btn-ghost" data-action="close-modal">关闭</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="config.js"></script>
<script src="vendor/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
